[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "n8n-sync"
version = "0.1.1"
description = "Git-friendly version control for n8n Community Edition workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Satwinder Badwal", email = "dev@b7co.in"}]
keywords = ["n8n", "version-control", "cli", "automation", "devops", "ci-cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = ["typer>=0.12", "httpx>=0.27", "rich>=13", "pydantic-settings>=2.2", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/badwalx/n8n-sync"
Documentation = "https://github.com/badwalx/n8n-sync#readme"
Repository = "https://github.com/badwalx/n8n-sync"
Issues = "https://github.com/badwalx/n8n-sync/issues"
Changelog = "https://github.com/badwalx/n8n-sync/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
n8n-sync = "n8n_sync.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
